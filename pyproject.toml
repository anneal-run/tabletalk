[project]
name = "tabletalk"
version = "0.1.0"
description = "Ask a SQLite database questions in plain language. Local LLM agent with tools, evals and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "sqlglot>=25",
    "typer>=0.12",
    "rich>=13",
    "mcp>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
tabletalk = "tabletalk.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tabletalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bin", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
