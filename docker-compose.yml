# docker compose run --rm tabletalk chat data/chinook.db
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -m /models/${LLM_MODEL_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080 -c 8192 --jinja -a local
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"

  tabletalk:
    build: .
    depends_on:
      - llama
    environment:
      TABLETALK_BASE_URL: http://llama:8080/v1
      TABLETALK_OPEN_CHARTS: "0"
    volumes:
      - ./data:/app/data
      - ./charts:/app/charts
      - ./traces:/app/traces
    stdin_open: true
    tty: true
